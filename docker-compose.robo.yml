# Robô automático de postagem (robo.py + ponte do WhatsApp).
# Na VPS:  docker compose -f docker-compose.robo.yml up -d --build
#
# Nenhuma porta é aberta para a internet: o robô fala com a ponte só pela
# rede interna do Docker.

services:
  robo:
    build: .
    command: ["python", "robo.py", "rodar"]
    env_file: .env
    environment:
      PASTA_DADOS: /dados
      URL_PONTE_WHATSAPP: http://whatsapp:3000
    restart: unless-stopped
    volumes:
      - ./dados:/dados
    depends_on:
      - whatsapp

  painel:
    build: .
    command: ["python", "painel.py"]
    env_file: .env
    environment:
      PASTA_DADOS: /dados
      URL_PONTE_WHATSAPP: http://whatsapp:3000
    restart: unless-stopped
    volumes:
      - ./dados:/dados
    # O acesso de fora passa pelo Caddy (HTTPS) do app web, que fica na rede
    # "achadinhos_default". O painel entra nessa rede com o nome
    # "painel-robo"; nenhuma porta é aberta direto para a internet.
    networks:
      default:
      site:
        aliases:
          - painel-robo
    depends_on:
      - whatsapp

  whatsapp:
    build:
      context: .
      dockerfile: Dockerfile.whatsapp
    restart: unless-stopped
    # A sessão do WhatsApp (pareamento) e o QR ficam em ./dados.
    volumes:
      - ./dados:/dados

networks:
  site:
    name: achadinhos_default
    external: true
