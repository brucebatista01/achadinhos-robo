<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Robô de Achadinhos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <span class="marca-icone" aria-hidden="true">🛍️</span>
      <div>
        <h1>Robô de Achadinhos</h1>
        <p>Cole o link, a gente monta a peça.</p>
      </div>
    </div>
  </header>

  <main class="conteudo">
    <form id="formulario" class="cartao formulario" novalidate>
      <div class="campo">
        <label for="link">Link do produto na Amazon</label>
        <div class="linha-com-botao">
          <input id="link" name="link" type="url" inputmode="url" autocomplete="off"
                 placeholder="https://amzn.to/..." required>
          <button type="button" id="botao-colar" class="botao botao-secundario" hidden>Colar</button>
        </div>
      </div>

      <div class="duas-colunas">
        <div class="campo">
          <label for="preco_por">Preço POR</label>
          <div class="com-prefixo">
            <span aria-hidden="true">R$</span>
            <input id="preco_por" name="preco_por" inputmode="decimal" autocomplete="off"
                   placeholder="129,90" required>
          </div>
        </div>
        <div class="campo">
          <label for="preco_de">Preço DE <span class="opcional">opcional</span></label>
          <div class="com-prefixo">
            <span aria-hidden="true">R$</span>
            <input id="preco_de" name="preco_de" inputmode="decimal" autocomplete="off"
                   placeholder="199,90">
          </div>
        </div>
      </div>

      <div class="campo">
        <label for="cupom">Cupom <span class="opcional">opcional</span></label>
        <input id="cupom" name="cupom" autocomplete="off" autocapitalize="characters"
               placeholder="EX: DESCONTO10" class="maiusculas">
      </div>

      <p id="erro-formulario" class="erro-formulario" role="alert" hidden></p>

      <button type="submit" id="botao-gerar" class="botao botao-principal botao-grande">
        Gerar peça
      </button>
    </form>

    <section aria-labelledby="titulo-pecas">
      <h2 id="titulo-pecas" class="titulo-secao">Suas peças</h2>
      <p id="vazio" class="vazio">As peças que você gerar aparecem aqui, prontas para copiar e postar no canal.</p>
      <div id="lista-pecas" class="lista-pecas"></div>
    </section>
  </main>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <template id="modelo-peca">
    <article class="cartao peca">
      <div class="peca-cabecalho">
        <div>
          <h3 class="peca-titulo"></h3>
          <p class="peca-detalhe"></p>
        </div>
        <span class="selo-estado"></span>
      </div>

      <div class="peca-progresso" hidden>
        <div class="barra"><div class="barra-preenchida"></div></div>
        <ol class="etapas"></ol>
      </div>

      <div class="peca-pronta" hidden>
        <img class="peca-imagem" alt="Imagem da peça gerada">
        <pre class="peca-mensagem"></pre>
        <div class="acoes">
          <button type="button" class="botao botao-principal" data-acao="copiar-texto">Copiar texto</button>
          <button type="button" class="botao botao-secundario" data-acao="copiar-imagem">Copiar imagem</button>
          <button type="button" class="botao botao-secundario" data-acao="compartilhar" hidden>Compartilhar</button>
          <a class="botao botao-secundario" data-acao="baixar">Baixar imagem</a>
        </div>
        <button type="button" class="botao botao-texto" data-acao="refazer">Não gostou? Gerar outra versão</button>
      </div>

      <div class="peca-erro" hidden>
        <p class="peca-erro-texto"></p>
        <button type="button" class="botao botao-secundario" data-acao="refazer">Tentar de novo</button>
      </div>
    </article>
  </template>

  <script src="static/app.js"></script>
</body>
</html>
