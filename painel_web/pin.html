<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel do Robô</title>
<style>
  :root { --fundo: #f4f5f7; --cartao: #fff; --texto: #1c1f24; --suave: #6b7280; --borda: #e3e5e9; --verde: #12a150; --vermelho: #d93a3a; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #0f1115; --cartao: #181b21; --texto: #e8eaee; --suave: #9aa1ad; --borda: #2a2f38; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fundo); color: var(--texto);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  form { background: var(--cartao); border: 1px solid var(--borda); border-radius: 14px; padding: 28px; width: 100%; max-width: 340px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--suave); margin: 0 0 20px; font-size: 14px; }
  input { font: inherit; font-size: 22px; letter-spacing: .25em; text-align: center; text-transform: uppercase; width: 100%;
    padding: 12px; border-radius: 10px; border: 1px solid var(--borda); background: var(--fundo); color: var(--texto); margin-bottom: 12px; }
  button { font: inherit; width: 100%; padding: 12px; border-radius: 10px; border: 0; background: var(--verde); color: #fff; font-weight: 600; cursor: pointer; }
  .erro { color: var(--vermelho); min-height: 20px; margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
<form id="form">
  <h1>Robô de Achadinhos</h1>
  <p>Digite o PIN para entrar no painel</p>
  <input id="pin" autocomplete="current-password" autofocus aria-label="PIN" maxlength="32">
  <button type="submit">Entrar</button>
  <div class="erro" id="erro"></div>
</form>
<script>
const base = location.pathname.replace(/\/$/, '') + '/';
document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const erro = document.getElementById('erro');
  erro.textContent = '';
  const r = await fetch(base + 'entrar', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin: document.getElementById('pin').value }) });
  if (r.ok) { location.reload(); return; }
  const d = await r.json().catch(() => ({}));
  erro.textContent = d.detail || 'Não deu certo. Tente de novo.';
};
</script>
</body>
</html>
